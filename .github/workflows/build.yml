# Checks every pull request into develop and every change to develop (spec 001-ci-and-badges): every example
# under specifications/ (every *.disl and *.did, and the legacy fixtures through their aliases) must validate against its
# specification's schema, as the constitution requires.
name: Build

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install jsonschema
      - name: Validate every example against its schema
        run: python .github/scripts/validate-examples.py
