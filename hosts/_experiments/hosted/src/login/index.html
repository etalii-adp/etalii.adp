<!doctype html>
<html lang="en" data-page="login" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · ADP</title>
<!-- before the first paint: theme, and which way the page turns in -->
<script src="../common/boot.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../common/css/tokens.css">
<link rel="stylesheet" href="../common/css/base.css">
<link rel="stylesheet" href="../common/css/transitions.css">
<link rel="stylesheet" href="login.css">
<!-- the page's script, bundled from TypeScript by npm run build; the page is painted once the script has drawn it -->
<script defer blocking="render" src="login.js"></script>
<noscript><style>html body{opacity:1}</style></noscript>
</head>
<body>
<div id="app">
  <section class="view" id="v-login">
    <div class="stage">
      <div class="sheet lg">
        <header class="lg-head">
          <div><h1>Sign in to ADP</h1><p class="sub">A Different Perspective</p></div>
          <a class="lg-home" data-nav href="../index.html" title="Back to the start page" aria-label="Back to the start page"><span class="logo-slot" data-size="40"></span></a>
        </header>
        <form class="lg-step" id="loginForm" novalidate>
          <label for="lg-ws">Workspace</label><input class="in" id="lg-ws" autocomplete="off">
          <label for="lg-email">Email</label><input class="in" id="lg-email" type="email" autocomplete="off">
          <label for="lg-pw">Password</label><input class="in" id="lg-pw" type="password" placeholder="Password" autocomplete="off" aria-describedby="lg-err">
          <p class="lg-msg" id="lg-err" role="alert" hidden></p>
          <label class="ckl" for="lg-keep"><input type="checkbox" id="lg-keep" checked> Keep me signed in on this computer</label>
          <button class="btn pri" type="submit">Sign In</button>
          <div class="or">or</div>
          <button class="btn" type="button" data-step="ssoForm">Sign In with Single Sign-On</button>
          <button class="btn" type="button" data-step="gitStep">Sign In with Your Git Provider</button>
        </form>
        <form class="lg-step" id="ssoForm" novalidate hidden>
          <h2>Single sign-on</h2>
          <label for="sso-ws">Workspace</label><input class="in" id="sso-ws" autocomplete="off">
          <p class="lg-msg" id="sso-msg" role="status" hidden></p>
          <button class="btn pri" type="submit">Continue</button>
          <button class="btn" type="button" data-step="loginForm">Back to Sign In</button>
        </form>
        <div class="lg-step" id="gitStep" hidden>
          <h2>Your git provider</h2>
          <div class="lg-providers" id="git-providers"></div>
          <p class="lg-msg" id="git-msg" role="status" hidden></p>
          <button class="btn" type="button" data-step="loginForm">Back to Sign In</button>
        </div>
      </div>
    </div>
  </section>
</div>
<noscript><p style="padding:24px">This page is drawn by its scripts. Turn JavaScript on to see it.</p></noscript>
</body>
</html>
