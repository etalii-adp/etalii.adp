# The documentation pages, as the text editor reads them.
# items has a page by the name its item has in solution.yaml; folders what every other page in a folder of that name starts as, and otherwise the rest. fresh is a page that was just made. {{name}} is the item's name and {{folder}} the name of the level it is in.

items:
  Architecture overview: >-
    <h1>Architecture overview</h1><p>Atlas Platform turns meter readings, grid telemetry and customer data into one shared model of the grid, and
    serves that model to analysts, AI models and the customer portal.</p><h2>How the solution is composed</h2><p>Each area in the Explorer is one
    concern. <strong>Ingestion</strong> lands data in Bronze and Silver tables. <strong>Ontology</strong> gives that data meaning.
    <strong>Schemas</strong> describe every record that enters or leaves. <strong>AI</strong> and <strong>Data analysis</strong> read through the
    ontology, never from raw tables. <strong>Portal</strong> shows the results to customers.</p><p>Open the root in Canvas to see these areas and the
    flows between them.</p><h2>What is reused</h2><ul><li><strong>Design system</strong>, linked at a tag, supplies every portal
    component.</li><li><strong>Identity and access</strong> supplies sign-in, roles and the access review.</li><li><strong>Audit logging</strong>
    supplies the audit trail pipeline and its viewer.</li></ul><p>Linked repositories appear as ordinary items. Their branch or tag is chosen per
    link.</p><h2>How a change ships</h2><p><code>Build and verify</code> runs the test suites and validation procedures. <code>Deploy to
    staging</code> follows on every merge into <code>develop</code>. <code>Deploy to production</code> waits for an approval.</p>
  002 Linked repositories for reuse: >-
    <h1>002 Linked repositories for reuse</h1><h2>Context</h2><p>Three projects need the same sign-in pages, audit trail and component library.
    Copying them makes the copies drift apart, and git submodules tie the layout of one repository to another.</p><h2>Decision</h2><p>A reusable
    feature lives in its own repository and is linked into a project. The Explorer continues the hierarchy from the other location, and the link names
    the branch or tag to follow. The link is recorded in the parent item's <code>.adp</code> file.</p><h2>Consequences</h2><ul><li>Items from a linked
    repository are read-only in the project that links them.</li><li>Production releases expect every link to follow a tag. The Release readiness
    procedure checks this.</li><li>A newer tag shows up as a note in Problems, so an upgrade is a decision and never a surprise.</li></ul>
