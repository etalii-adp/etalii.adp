    from pathlib import Path

    from pydantic_settings import BaseSettings, SettingsConfigDict


    class Settings(BaseSettings):
        """Read from the environment, and from .env on a developer's computer. Every name starts with COLLECTOR_."""

        model_config = SettingsConfigDict(env_prefix="COLLECTOR_", env_file=".env")

        head_end_url: str
        head_end_token: str
        landing_path: Path = Path("/mnt/landing/smart-meter-readings")
        interval_hours: int = 1
        log_level: str = "INFO"
  head_end.py: |-
    """The head-end system: where the smart meters deliver what they measured."""
    from collections.abc import Iterator
    from datetime import datetime
    from typing import Self

    import httpx
    from pydantic import BaseModel


    class Reading(BaseModel):
        meter_id: str
        read_at: datetime
        value: float
        unit: str = "kWh"
        quality: str = "ok"


    class HeadEndClient:
        def __init__(self, url: str, token: str) -> None:
            self._http = httpx.Client(base_url=url, headers={"Authorization": f"Bearer {token}"}, timeout=30)

        def __enter__(self) -> Self:
            return self

        def __exit__(self, *exc: object) -> None:
            self._http.close()

        def readings(self, since: datetime, until: datetime) -> Iterator[Reading]:
            """Every reading between since and until, page by page."""
            page: str | None = "readings"
            params: dict[str, str] | None = {"from": since.isoformat(), "to": until.isoformat()}
            while page:
                response = self._http.get(page, params=params)
                response.raise_for_status()
                body = response.json()
                yield from (Reading.model_validate(item) for item in body["items"])
                page, params = body.get("next"), None
  validation.py: |-
    """Keeps out what the Meter reading schema refuses anyway, so that one bad meter does not hold up a whole file."""
    import re
    from collections.abc import Iterable

    from reading_collector.head_end import Reading

    METER_ID = re.compile(r"^M[0-9]{8}$")
    UNITS = {"kWh", "kW", "V"}


    def problem_of(reading: Reading) -> str | None:
        """Why a reading is refused, or None when it is fine."""
        if not METER_ID.match(reading.meter_id):
            return "meter id is not M and eight digits"
        if reading.value < 0:
            return "value is below zero"
        if reading.unit not in UNITS:
            return f"unit {reading.unit} is not known"
        return None


    def split_valid(readings: Iterable[Reading]) -> tuple[list[Reading], list[tuple[Reading, str]]]:
        valid: list[Reading] = []
        rejected: list[tuple[Reading, str]] = []
        for reading in readings:
            problem = problem_of(reading)
            if problem is None:
                valid.append(reading)
            else:
                rejected.append((reading, problem))
        return valid, rejected
  landing_zone.py: |-
    """The landing zone: the folder the Smart meter readings source watches."""
    import csv
    from datetime import datetime
    from pathlib import Path

    from reading_collector.head_end import Reading


    class LandingZone:
        def __init__(self, path: Path) -> None:
            self._path = path

        def write(self, readings: list[Reading], until: datetime) -> Path:
            """One file per interval, written under another name first, so that the source never picks up half a file."""
            target = self._path / f"readings-{until:%Y%m%dT%H%M}.csv"
            partial = target.with_suffix(".part")
            with partial.open("w", newline="") as file:
                writer = csv.writer(file)
                writer.writerow(["meter_id", "read_at", "value", "unit", "quality"])
                for r in readings:
                    writer.writerow([r.meter_id, r.read_at.isoformat(), r.value, r.unit, r.quality])
            return partial.rename(target)

        def write_rejected(self, rejected: list[tuple[Reading, str]], until: datetime) -> Path:
            target = self._path / "rejected" / f"readings-{until:%Y%m%dT%H%M}.csv"
            target.parent.mkdir(exist_ok=True)
            with target.open("w", newline="") as file:
                writer = csv.writer(file)
                writer.writerow(["meter_id", "read_at", "value", "problem"])
                writer.writerows([r.meter_id, r.read_at.isoformat(), r.value, problem] for r, problem in rejected)
            return target
