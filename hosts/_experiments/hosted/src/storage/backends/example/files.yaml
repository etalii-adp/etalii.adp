  Program.cs: |-
    // The Atlas console client: the outages, a customer's usage and the load forecast of the Atlas Platform, from a terminal.
    using Atlas.ConsoleClient.Client;
    using Atlas.ConsoleClient.Commands;
    using Microsoft.Extensions.Configuration;

    var settings = new ConfigurationBuilder()
        .SetBasePath(AppContext.BaseDirectory)
        .AddJsonFile("appsettings.json")
        .AddEnvironmentVariables("ATLAS_")
        .Build();

    using var client = new AtlasClient(new Uri(settings["BaseUrl"]!), settings["Token"]);
    ICommand[] commands = [new OutagesCommand(client), new UsageCommand(client), new ForecastCommand(client)];

    var command = commands.FirstOrDefault(c => c.Name == args.FirstOrDefault());
    if (command is null)
    {
        Console.WriteLine("Usage: atlas COMMAND [options]");
        foreach (var c in commands) Console.WriteLine($"  {c.Name,-10} {c.Help}");
        return 1;
    }

    return await command.RunAsync(args[1..], CancellationToken.None);
  ICommand.cs: |-
    namespace Atlas.ConsoleClient.Commands;

    // One command of the console client, such as atlas outages.
    public interface ICommand
    {
        string Name { get; }
        string Help { get; }

        // Runs the command and returns the exit code of the process.
        Task<int> RunAsync(string[] args, CancellationToken cancellationToken);
    }
  OutagesCommand.cs: |-
    using Atlas.ConsoleClient.Client;

    namespace Atlas.ConsoleClient.Commands;

    // atlas outages [--region NAME]: the outages that are open now, the largest first.
    public sealed class OutagesCommand(AtlasClient client) : ICommand
    {
        public string Name => "outages";
        public string Help => "Lists the open outages, the largest first";

        public async Task<int> RunAsync(string[] args, CancellationToken cancellationToken)
        {
            var region = args is ["--region", var name] ? name : null;
            var outages = await client.GetOutagesAsync(region, cancellationToken);

            Console.WriteLine("Feeder      Postcode    Homes  Reported          Cause");
            foreach (var o in outages.OrderByDescending(o => o.HomesAffected))
            {
                Console.WriteLine($"{o.Feeder,-12}{o.Postcode,-10}{o.HomesAffected,7}  {o.ReportedAt:yyyy-MM-dd HH:mm}  {o.Cause}");
            }

            return 0;
        }
    }
  UsageCommand.cs: |-
    using Atlas.ConsoleClient.Client;

    namespace Atlas.ConsoleClient.Commands;

    // atlas usage CUSTOMER [--month yyyy-MM]: what a customer used in a month, day by day.
    public sealed class UsageCommand(AtlasClient client) : ICommand
    {
        public string Name => "usage";
        public string Help => "Shows what a customer used in a month";

        public async Task<int> RunAsync(string[] args, CancellationToken cancellationToken)
        {
            if (args.Length == 0)
            {
                Console.Error.WriteLine("usage: a customer number is required");
                return 2;
            }

            var month = args is [_, "--month", var value]
                ? DateOnly.ParseExact(value + "-01", "yyyy-MM-dd")
                : DateOnly.FromDateTime(DateTime.Today);
            var usage = await client.GetUsageAsync(args[0], month, cancellationToken);

            foreach (var day in usage.Days)
            {
                var bar = new string('#', (int)(day.Kwh / usage.PeakKwh * 40));
                Console.WriteLine($"{day.Date:ddd dd}  {day.Kwh,7:F1} kWh  {bar}");
            }

            Console.WriteLine($"Total {usage.TotalKwh:F1} kWh on the {usage.Tariff} tariff");
            return 0;
        }
    }
  ForecastCommand.cs: |-
    using Atlas.ConsoleClient.Client;

    namespace Atlas.ConsoleClient.Commands;

    // atlas forecast [--hours N]: the load the Load forecast model expects for the hours ahead.
    public sealed class ForecastCommand(AtlasClient client) : ICommand
    {
        public string Name => "forecast";
        public string Help => "Shows the load forecast for the hours ahead";

        public async Task<int> RunAsync(string[] args, CancellationToken cancellationToken)
        {
            var hours = args is ["--hours", var value] ? int.Parse(value) : 24;
            var forecast = await client.GetForecastAsync(hours, cancellationToken);

            foreach (var point in forecast)
            {
                Console.WriteLine($"{point.At:ddd HH:mm}  {point.LoadMw,8:F1} MW  +/- {point.MarginMw:F1}");
            }

            return 0;
        }
    }
  AtlasClient.cs: |-
    using System.Net.Http.Headers;
    using System.Net.Http.Json;

    namespace Atlas.ConsoleClient.Client;

    // Talks to the API of the Atlas Platform. What it returns follows the API schemas of the solution.
    public sealed class AtlasClient : IDisposable
    {
        private readonly HttpClient _http;

        public AtlasClient(Uri baseUrl, string? token)
        {
            _http = new HttpClient { BaseAddress = baseUrl };
            if (token is not null) _http.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Bearer", token);
        }

        public async Task<IReadOnlyList<OutageReport>> GetOutagesAsync(string? region, CancellationToken cancellationToken)
        {
            var url = region is null ? "outages" : "outages?region=" + Uri.EscapeDataString(region);
            return await _http.GetFromJsonAsync<List<OutageReport>>(url, cancellationToken) ?? [];
        }

        public async Task<UsageSummary> GetUsageAsync(string customerNumber, DateOnly month, CancellationToken cancellationToken)
        {
            var url = $"customers/{Uri.EscapeDataString(customerNumber)}/usage?month={month:yyyy-MM}";
            var usage = await _http.GetFromJsonAsync<UsageSummary>(url, cancellationToken);
            return usage ?? throw new InvalidOperationException($"There is no usage for customer {customerNumber}");
        }

        public async Task<IReadOnlyList<ForecastPoint>> GetForecastAsync(int hours, CancellationToken cancellationToken)
        {
            return await _http.GetFromJsonAsync<List<ForecastPoint>>($"forecast/load?hours={hours}", cancellationToken) ?? [];
        }

        public void Dispose() => _http.Dispose();
    }
  OutageReport.cs: |-
    namespace Atlas.ConsoleClient.Client;

    // An outage as the API reports it. Its fields are those of the API schema Outage report.
