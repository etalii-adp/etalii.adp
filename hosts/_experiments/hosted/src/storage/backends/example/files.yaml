  __main__.py: |-
    """Collects the readings of the last interval and drops them where the ingestion picks them up."""
    import logging
    import sys
    from datetime import UTC, datetime, timedelta

    from reading_collector.head_end import HeadEndClient
    from reading_collector.landing_zone import LandingZone
    from reading_collector.settings import Settings
    from reading_collector.validation import split_valid

    log = logging.getLogger("reading_collector")


    def main() -> int:
        settings = Settings()
        logging.basicConfig(level=settings.log_level)
        until = datetime.now(UTC).replace(minute=0, second=0, microsecond=0)
        since = until - timedelta(hours=settings.interval_hours)

        with HeadEndClient(settings.head_end_url, settings.head_end_token) as head_end:
            readings = list(head_end.readings(since, until))

        valid, rejected = split_valid(readings)
        zone = LandingZone(settings.landing_path)
        written = zone.write(valid, until)
        if rejected:
            zone.write_rejected(rejected, until)

        log.info("%d readings in %s, %d rejected", len(valid), written.name, len(rejected))
        return 0 if valid or not readings else 1


    if __name__ == "__main__":
        sys.exit(main())
