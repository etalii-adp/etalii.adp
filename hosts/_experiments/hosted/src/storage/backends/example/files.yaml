# The files beside the items: texts has the text of a file by its name on disk, and holds says what a file or folder is for.
# sql and otherwise are what a file starts as that has no text here: {{file}} is its name, and {{name}}, {{id}} and {{kind}} are of the item it belongs to.

holds:
  .adp: Shared settings and canvas layout
  .user.adp: Your personal overrides
  Atlas.ConsoleClient.csproj: "The C# project: what it builds, for which .NET, and the packages it uses"
  appsettings.json: The settings the console client starts with
  packages.lock.json: The exact version of every package, so that every build restores the same ones
  bin: What the build writes
  Debug: What a Debug build writes
  net10.0: What the build writes for .NET 10
  atlas.dll: The console client as built
  atlas.pdb: The debug symbols of the console client
  obj: What the build keeps between runs
  project.assets.json: What the last restore of the packages worked out
  pyproject.toml: "The Python project: its name, the Python it needs, and its dependencies"
  uv.lock: The exact version of every package, so that every computer installs the same ones
  .python-version: The Python version that tools pick for this folder
  __init__.py: Makes the folder a Python package
  conftest.py: What the tests share
  .env: Settings for running the collector on this computer
  .venv: The virtual environment of the project, with its installed packages
  pyvenv.cfg: How the virtual environment was made
  .pytest_cache: What pytest keeps between runs
  CACHEDIR.TAG: Marks the folder as a cache, so that backups skip it
