    from datetime import UTC, datetime

    import pytest

    from reading_collector.head_end import Reading


    @pytest.fixture
    def reading() -> Reading:
        return Reading(meter_id="M00412877", read_at=datetime(2026, 3, 1, 12, tzinfo=UTC), value=1.25)
  test_validation.py: |-
    from reading_collector.validation import problem_of, split_valid


    def test_a_good_reading_has_no_problem(reading):
        assert problem_of(reading) is None


    def test_a_value_below_zero_is_refused(reading):
        assert problem_of(reading.model_copy(update={"value": -1})) == "value is below zero"


    def test_an_unknown_meter_id_is_refused(reading):
        assert problem_of(reading.model_copy(update={"meter_id": "X1"})) == "meter id is not M and eight digits"


    def test_the_refused_ones_are_split_off(reading):
        bad = reading.model_copy(update={"unit": "MWh"})
        valid, rejected = split_valid([reading, bad])
        assert valid == [reading]
        assert rejected == [(bad, "unit MWh is not known")]
  test_landing_zone.py: |-
    from datetime import UTC, datetime

    from reading_collector.landing_zone import LandingZone


    def test_one_file_per_interval(tmp_path, reading):
        written = LandingZone(tmp_path).write([reading], datetime(2026, 3, 1, 13, tzinfo=UTC))
        assert written.name == "readings-20260301T1300.csv"
        assert written.read_text().splitlines()[1] == "M00412877,2026-03-01T12:00:00+00:00,1.25,kWh,ok"


    def test_no_partial_file_is_left(tmp_path, reading):
        LandingZone(tmp_path).write([reading], datetime(2026, 3, 1, 13, tzinfo=UTC))
        assert not list(tmp_path.glob("*.part"))
