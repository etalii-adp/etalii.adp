  - title: How do the linked repositories get updated?
    day: Earlier
    time: 14 Nov
    messages:
      - author: user
        time: 10:20
        text: How do the linked repositories get updated?
        items: [ Components ]
      - author: agent
        time: 10:22
        text: |-
          Each linked repository follows one branch or tag, which is set in the Properties of the item it is linked in at. Design system follows the tag v3.2.0 and Audit logging v1.8.2, so they change only when somebody picks another tag. Identity and access follows the branch release/2.x and moves with every fetch.

          Audit logging has a newer tag, v1.9.0. What is inside a linked repository is read-only here: a change is made in its own project and arrives with the next tag.
        items: [ Design system, Audit logging, Identity and access ]
        steps: [ Read the linked repositories and what they follow ]
