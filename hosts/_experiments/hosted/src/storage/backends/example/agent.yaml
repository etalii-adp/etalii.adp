# The conversations with the agent that are over, newest first. A message names the items it is about.

conversations:
  - title: Why does the meter readings pipeline fail validation?
    day: Today
    time: 09:41
    messages:
      - author: user
        time: 09:38
        text: Why does the meter readings pipeline fail validation?
        items: [ Meter readings to Bronze ]
      - author: agent
        time: 09:39
        text: |-
          Its step "Map to ontology" writes Meter.tariffClass, and Meter in the Asset model has no attribute of that name: it has serialNumber, installedOn and intervalMinutes. The step before it, Deduplicate, is new as well, and the model was not changed with the pipeline.

          There are two ways out:
          • Add tariffClass to Meter in the Asset model, as an enum that takes its values from the Tariff classes vocabulary. That vocabulary is new and nothing uses it yet, so this is probably what was meant.
          • Take the mapping out of the step until the model has the attribute.
        items: [ Meter readings to Bronze, Asset model, Tariff classes ]
        steps:
          - "Read Meter readings to Bronze: 8 steps"
          - Read the entity types of Asset model
          - Read what validation found
      - { author: user, time: 09:40, text: The first. What type should the attribute have? }
      - author: agent
        time: 09:41
        text: |-
          An enum. Tariff classes holds Residential and Commercial as concepts, so the attribute reads "tariffClass: enum" on Meter. I would not make it required: a meter that has no contract yet has no tariff either.

          After that the pipeline validates, and Tariff classes loses its note that nothing uses it.
        items: [ Asset model, Tariff classes ]
        steps: [ Read Tariff classes ]
  - title: What is left before we can release to production?
    day: Yesterday
    time: 17:34
    messages:
      - author: user
        time: 17:31
        text: What is left before we can release to production?
        items: [ Deploy to production ]
      - author: agent
        time: 17:33
        text: |-
          Three things stand between this branch and production:
          • Deploy to production has an approval gate with no approver group, so the gate can never be passed. That is an error.
          • Identity and access is pinned to the branch release/2.x. A release that follows a branch is not repeatable; v2.4.1 is its newest tag.
          • Release readiness, the validation procedure, fails two of its four checks for exactly these reasons: open errors in Problems, and a linked repository that is not pinned to a tag.

          Its check that all test suites are green on staging passes.
        items: [ Deploy to production, Identity and access, Release readiness ]
        steps:
          - Read the release pipelines and the environments
          - Read what validation found
          - Read the linked repositories and what they follow
      - { author: user, time: 17:34, text: Who can approve? }
      - author: agent
        time: 17:34
        text: >-
          The project does not say. Production says that an approval is needed, without saying whose, and Release readiness names a release manager as
          the owner of its checks. Roles and permissions, in Identity and access, is where a role for it would be defined: it has User, Role and
          Permission.
        items: [ Production, Release readiness, Roles and permissions ]
        steps: [ Read Production, Read Roles and permissions ]
  - title: The map on the Outage map page shows nothing
    day: Yesterday
    time: 11:08
    messages:
      - author: user
        time: 11:05
        text: The map on the Outage map page shows nothing. What should it be bound to?
        items: [ Outage map ]
      - author: agent
        time: 11:07
        text: |-
          The Map component on that page has no data binding, which is why it draws its background and no outages.

          The table below it gets its rows from Outage heatmap in Data analysis. The map needs places as well, and those are in Grid topology: a Feeder is fed by a Substation, which a Region contains. Bind the map to Grid topology and it can place each outage on its feeder.
        items: [ Outage map, Grid topology, Outage heatmap ]
        steps: [ "Read Outage map: 5 sections", Read the entity types of Grid topology ]
      - { author: user, time: 11:08, text: "Good, I will do that after the review." }
      - author: agent
        time: 11:08
        text: Then the warning on Outage map stays until the binding is set. Nothing else on the page depends on it.
        items: [ Outage map ]
  - title: Which pipelines read the smart meter source?
    day: Monday
    time: 14:52
    messages:
      - author: user
        time: 14:51
        text: Which pipelines read the smart meter source?
        items: [ Smart meter readings ]
      - author: agent
        time: 14:52
        text: |-
          One: Meter readings to Bronze. It validates the readings against the schema Meter reading, removes duplicates and writes Bronze meter readings and, past its quality gate, Silver meter readings.

          Past that pipeline, Load forecast names it as its training data. A change to the source or to its schema reaches both.
