  - title: Summarise what changed in the load forecast
    day: Last week
    time: 24 Nov
    messages:
      - author: user
        time: 16:12
        text: Summarise what changed in the load forecast since the last release.
        items: [ Load forecast ]
      - author: agent
        time: 16:14
        text: |-
          Since v0.8.0 one commit touched it, "Tune load forecast model and add the 2025 backtest" by Mei Tanaka on 23 Nov, which came in with pull request #207 a day later.
          • The model forecasts the system load of the next 48 hours and is retrained weekly.
          • Forecast backtest 2025 is its evaluation set. Validation notes that the set is 43 days older than the model, so its figures say little about the last tuning.
          • Forecast error analysis, the notebook, plots the error per hour of the day.
        items: [ Load forecast, Forecast backtest 2025, Forecast error analysis ]
