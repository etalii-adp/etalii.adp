# The portal pages: the sections each page is made of, and how each kind of section looks.
# A part of a section is filled in by the page it is on: {{name}} is the page's name, and a name under parts is the text that part has for that page.
# unbound names the sections that have no data yet; library is where the components a page can use come from.

items:
  Home: [ nav, hero, cards, footer ]
  Outage map: [ nav, title, map, table, footer ]
  My usage: [ nav, title, chart, cards, footer ]
  Report an outage: [ nav, title, form, footer ]
  Admin console: [ nav, title, table, footer ]
  Sign-in page: [ title, form ]
otherwise: [ nav, drop ]
sections:
  nav:
    name: Header
    binding: Static
    refresh: On load
    html: >-
      <div class="b-nav" style="display:flex"><b>Atlas Energy</b><span>Home</span><span>Outage map</span><span>My usage</span><span>Report an
      outage</span><span class="fake">Sign in</span></div>
  hero:
    name: Hero
    binding: Static
    refresh: On load
    html: >-
      <div class="b-hero" style="margin:-14px -20px"><h2>Is the power on in your street?</h2><p>Check live outages, follow repairs and see when power
      is expected back.</p><div class="rowf"><span class="fin">Postcode</span><span class="fake">Check</span></div></div>
  cards:
    name: Card grid
    binding: Data analysis / Outage heatmap
    refresh: On load
    html: >-
      <div class="b-cards"><div><b>3 active outages</b><p>Affecting 412 homes in the North region</p></div><div><b>My usage</b><p>7.4 kWh today, 12%
      below last week</p></div><div><b>Report a problem</b><p>Tell us about an outage or a damaged cable</p></div></div>
  map:
    name: Map
    binding: Data analysis / Outage heatmap
    refresh: Every 60 s
    html: >-
      <div class="b-map"><svg viewBox="0 0 600 190"><path d="M30 40l120-20 90 40 60-30 130 20 120 60-60 70-170 0-90-30-120 20-70-50z" fill="#dfe7ee"
      stroke="#c3ced9"/><path d="M150 20l90 40-20 60-110 10M300 30l-20 90 110 40M430 50l-60 100" fill="none" stroke="#c3ced9"/><g
      fill="#d6453d"><circle cx="190" cy="80" r="7"/><circle cx="330" cy="120" r="7"/><circle cx="470" cy="100" r="7"/></g><g fill="#e0a100"><circle
      cx="110" cy="110" r="5"/><circle cx="400" cy="70" r="5"/></g></svg>{{warning}}</div>
    parts:
      warning:
        items:
          Outage map: <span class="warnb">No data binding. Bind this map to Grid topology to show live outages.</span>
        otherwise: ""
  chart:
    name: Chart
    binding: Data analysis / Outage heatmap
    refresh: On load
    html: >-
      <div class="pbars" style="margin-bottom:20px"><div style="height:62%"><span>Mon</span></div><div style="height:71%"><span>Tue</span></div><div
      style="height:58%"><span>Wed</span></div><div style="height:80%"><span>Thu</span></div><div style="height:66%"><span>Fri</span></div><div
      style="height:92%"><span>Sat</span></div><div style="height:74%"><span>Sun</span></div></div>
  form:
    name: Form
    binding: Static
    refresh: On load
    html: >-
      <div class="b-form"><label>Postcode<span class="fin">1234 AB</span></label><label>House number<span class="fin">12</span></label><label>What do
      you see?<span class="fin">No power in the whole street</span></label><label>Contact number<span class="fin">Optional</span></label></div><p
      style="margin-top:12px"><span class="fake">{{button}}</span></p>
    parts: { button: { items: { Sign-in page: Sign in }, otherwise: Send report } }
  table:
    name: Table
    binding: Data analysis / Outage heatmap
    refresh: Every 60 s
    html: >-
      <table class="ptable"><thead><tr><th>Area</th><th>Since</th><th>Homes</th><th>Status</th><th>Expected
      back</th></tr></thead><tbody><tr><td>North, Elm Park</td><td>09:12</td><td>236</td><td>Crew on site</td><td>12:30</td></tr><tr><td>North,
      Harbour Road</td><td>10:40</td><td>148</td><td>Fault located</td><td>13:15</td></tr><tr><td>South, Mill
      Lane</td><td>11:05</td><td>28</td><td>Reported</td><td>To be confirmed</td></tr></tbody></table>
  footer:
    name: Footer
    binding: Static
    refresh: On load
    html: <div>Atlas Energy · Privacy · Accessibility · Contact</div>
  title:
    name: Heading
    binding: Static
    refresh: On load
    html: <h2>{{name}}</h2><p>{{about}}</p>
    parts:
      about:
        items:
          Outage map: Live outages and planned work in your region.
          My usage: Your electricity use per day, from your smart meter.
          Admin console: Open reports and their handling status.
        otherwise: Tell us what you see. We reply within the hour.
  drop:
    name: Empty section
    binding: Static
    refresh: On load
    html: <div>Drag a component here.</div>
unbound: { binding: None, sections: { Outage map: [ map ] } }
library:
  item: Design system
  kind: component
  more: [ Table, Footer ]
  from: Design system @ {{ref}}
