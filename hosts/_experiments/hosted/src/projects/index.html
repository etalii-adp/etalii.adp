<!doctype html>
<html lang="en" data-page="projects" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Projects · ADP</title>
<!-- before the first paint: theme, and which way the page turns in -->
<script src="../common/boot.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../common/css/tokens.css">
<link rel="stylesheet" href="../common/css/base.css">
<link rel="stylesheet" href="../common/css/transitions.css">
<link rel="stylesheet" href="../common/css/popups.css">
<link rel="stylesheet" href="projects.css">
<link rel="stylesheet" href="wizard.css">
<!-- the page's script, bundled from TypeScript by npm run build; the page is painted once the script has drawn it -->
<script type="module" blocking="render" src="projects.js"></script>
<noscript><style>html body{opacity:1}</style></noscript>
</head>
<body>
<div id="app">
  <section class="view" id="v-projects">
    <div class="stage">
      <div class="sheet pj">
        <aside class="pj-side">
          <div class="pj-brand"><span class="logo-slot" data-size="34"></span><div><b>ADP</b><small id="pj-ver"></small></div></div>
          <button class="pj-nav on" data-pf="all">Projects <span id="pj-n1"></span></button>
          <button class="pj-nav" data-pf="reuse">Assets <span id="pj-n2"></span></button>
          <div class="sp"></div>
          <button class="pj-nav" id="pj-me" data-go="login"></button>
        </aside>
        <main class="pj-main">
          <p class="pj-note">Every project is a git repository. Assets are repositories that are linked into other projects.</p>
          <div class="pj-bar">
            <input class="in" id="pj-q" placeholder="Search projects" aria-label="Search projects">
            <button class="btn pri" id="pj-new" disabled>New Project</button>
            <button class="btn" data-nyi="Open">Open</button>
            <button class="btn" data-nyi="Clone Repository">Clone Repository</button>
          </div>
          <div id="pj-list"></div>
        </main>
      </div>
    </div>
  </section>
</div>
<noscript><p style="padding:24px">This page is drawn by its scripts. Turn JavaScript on to see it.</p></noscript>
</body>
</html>
