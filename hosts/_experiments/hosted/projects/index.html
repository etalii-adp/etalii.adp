<!doctype html>
<html lang="en" data-page="projects" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Projects · ADP</title>
<!-- before the first paint: theme, and which way the page turns in -->
<script src="../common/js/boot.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../common/css/tokens.css">
<link rel="stylesheet" href="../common/css/base.css">
<link rel="stylesheet" href="../common/css/transitions.css">
<link rel="stylesheet" href="../common/css/popups.css">
<link rel="stylesheet" href="projects.css">
<!-- plain scripts, loaded in this order; the page is painted once they have drawn it -->
<script defer blocking="render" src="../common/js/dom.js"></script>
<script defer blocking="render" src="../common/js/icons.js"></script>
<script defer blocking="render" src="../common/js/popups.js"></script>
<script defer blocking="render" src="../common/js/nav.js"></script>
<script defer blocking="render" src="../common/js/mockup.js"></script>
<script defer blocking="render" src="data/projects.js"></script>
<script defer blocking="render" src="projects.js"></script>
<noscript><style>html body{opacity:1}</style></noscript>
</head>
<body>
<div id="app">
  <section class="view" id="v-projects">
    <div class="pj">
      <aside class="pj-side">
        <div class="pj-brand"><span class="logo-slot" data-size="34"></span><div><b>ADP</b><small>2026.3</small></div></div>
        <button class="pj-nav on" data-pf="all">Projects <span id="pj-n1"></span></button>
        <button class="pj-nav" data-pf="reuse">Reusable repositories <span id="pj-n2"></span></button>
        <div class="sp"></div>
        <button class="pj-nav" data-go="login"><span class="avatar" style="margin:0">SR</span> Sam Rivera <span>Sign out</span></button>
      </aside>
      <main class="pj-main">
        <div class="topline" style="background:none;border:0;padding:0 0 14px"><span>Every project is a git repository. Reusable repositories are linked into other projects.</span><span class="pager-slot"></span></div>
        <div class="pj-bar">
          <input class="in" id="pj-q" placeholder="Search projects" aria-label="Search projects">
          <button class="btn pri" data-nyi="New Project">New Project</button>
          <button class="btn" data-nyi="Open">Open</button>
          <button class="btn" data-nyi="Clone Repository">Clone Repository</button>
        </div>
        <div id="pj-list"></div>
      </main>
    </div>
  </section>
</div>
<noscript><p style="padding:24px">This mockup is drawn by its scripts. Turn JavaScript on to see it.</p></noscript>
</body>
</html>
