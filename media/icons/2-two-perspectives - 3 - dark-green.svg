      <rect transform="matrix(0.866 0.5 -0.866 0.5 250 332)" x="-85" y="-85" width="170" height="170" rx="14" fill="#008200" stroke="#008200" stroke-width="8"/>
    </g>
    <path d="M186 196v96M314 196v96" stroke="#008200" stroke-width="5" stroke-dasharray="4 14"/>
