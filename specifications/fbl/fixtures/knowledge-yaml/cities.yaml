knowledge: "0.1"
# Cities of the Low Countries, kept by hand and by ADP.
name: Cities
activeView: v1
properties:
  - id: p1
    name: Name
    type: text
    title: true
  - id: p2
    name: Country
    type: selection
    options:
      - id: o1
        name: Netherlands
        colour: blue
      - id: o2
        name: Belgium
        colour: yellow
  - id: p3
    name: Population
    type: number
views:
  - id: v1
    name: All cities
    columns:
      - property: p3
        width: 120
    sorts:
      - property: p3
        direction: descending
    filter:
      - property: p2
        operator: is
        option: o2
    groupBy: p2
rows:
  - id: r1
    cells:
      - property: p1
        text: Amsterdam
      - property: p2
        option: o1
      - property: p3
        number: 931298
    source: census 2024   # not modelled, kept
  - id: r2
    cells:
      - property: p1
        text: Antwerp
      - property: p2
        option: o2
